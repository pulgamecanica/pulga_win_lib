[package]
name = "pulga_win_lib"
version = "0.1.0"
edition = "2024"

[dependencies]
gl = "0.14.0"
pulgamecanica_matrix = "1.0.2"
raw-window-handle = "0.6.2"
winit = "0.30.13"

# Native GL context creation only; the web backend will get its context
# from a <canvas> instead (not built yet).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
glutin = "0.32.3"
glutin-winit = "0.5.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
